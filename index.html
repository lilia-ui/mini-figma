<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Небольшая страница о начале пути в веб-разработке."
    />
    <title>[Имя] — ученик веб-разработчика</title>
    <style>
      :root {
        color-scheme: light;
        --color-background: #f7f7f5;
        --color-surface: #ffffff;
        --color-text: #18181b;
        --color-muted: #52525b;
        --color-accent: #2563eb;
        --color-border: #e4e4e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, #e0e7ff 0, transparent 32rem),
          var(--color-background);
        color: var(--color-text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid var(--color-border);
        border-top: 4px solid var(--color-accent);
        border-radius: 20px;
        background: color-mix(in srgb, var(--color-surface) 94%, transparent);
        box-shadow: 0 24px 64px rgb(24 24 27 / 10%);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--color-accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 62ch;
        margin: 0 0 16px;
        color: var(--color-muted);
        font-size: clamp(1rem, 2.5vw, 1.125rem);
      }

      p:last-child {
        margin-bottom: 0;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: appear 450ms ease-out both;
        }
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Начало пути</p>
      <h1>[Имя]</h1>
      <p>
        Я учусь веб-разработке и каждый день открываю для себя что-то новое:
        разметку, стили, JavaScript и способы превращать идеи в удобные страницы.
      </p>
      <p>
        Моя цель — постепенно разобраться в основах, много практиковаться и
        создавать собственные проекты, которыми будет приятно делиться.
      </p>
    </main>
  </body>
</html>
